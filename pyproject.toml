[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm2-claimer"
version = "0.1.0"
description = "Watches BHOPP and BloxyMarket for MM2 items, buys watched ones within your limits, and is run from Discord."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11,<4",
    "python-dotenv>=1.0,<2",
    "discord.py>=2.4,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mm2claimer = "mm2claimer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
